name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the trusted copy (the last release) and take every security check from it
        # Every security check (trailers, signatures, leak scan) and its config comes from the last release, never from
        # the pushed tree, and a missing copy fails (security@'s controls 7 widened and 8, 19 Nov 2026). The range starts
        # at the last release tag, not github.event.before: GitHub drops a pending run when a newer one queues, and the
        # surviving run's "before" is the dropped push's head (specialist.code@ finding 3b). The workflow file itself
        # still comes from the pushed tree; only branch protection with a required check (Dinis's) closes that.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$AFTER" 2>/dev/null || true)
          base=c8fff24023c597a36a76966af5d585b51944c966
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] || { echo "a shallow checkout: refusing (fetch-depth must be 0)" >&2; exit 1; }
          # a run started by a person by hand has no "before": it starts from the last release tag
          if [ "$EVENT" = "workflow_dispatch" ]; then BEFORE="$last"; fi
          # BEFORE must be the dev this push builds on (on the base's line, an ancestor of AFTER); otherwise refuse
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$base" "$BEFORE" || ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo "cannot find the release this push builds on (force push or new history): refusing; a person decides" >&2; exit 1
          fi
          # the checks come from BEFORE, the dev this push builds on, already checked (security@'s third ruling, 3724c9ca2);
          # never from a tag, the base or the pushed tree. A release tag may only widen the range, and only if it points
          # to an ancestor of BEFORE (a pushed tag alone is not trusted)
          if [ -n "$last" ] && git merge-base --is-ancestor "$last" "$BEFORE"; then from="$last"; else from="$BEFORE"; fi
          dir="$RUNNER_TEMP/trusted"; mkdir -p "$dir"
          for f in check-commits.mjs check-signatures.mjs leak-scan.mjs; do
            git show "$BEFORE:scripts/$f" > "$dir/$f" || { echo "the trusted copy of $f is missing at $BEFORE: refusing" >&2; exit 1; }
          done
          echo "TRUSTED_FROM=$from" >> "$GITHUB_ENV"; echo "TRUSTED_DIR=$dir" >> "$GITHUB_ENV"
      - name: Every commit since the last release carries an Agent trailer (trusted copy)
        env:
          AFTER: ${{ github.sha }}
        run: node "$TRUSTED_DIR/check-commits.mjs" "$TRUSTED_FROM" "$AFTER"
      - name: Every new commit is signed by its agent's published key and names its session (trusted copy)
        env:
          AFTER: ${{ github.sha }}
        run: node "$TRUSTED_DIR/check-signatures.mjs" "$TRUSTED_FROM" "$AFTER"
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Leak scan tests (each key rule)
        run: node scripts/test-leak-scan.mjs
      - name: Pulse reader tests (daily NVD totals)
        run: node scripts/test-pulse-daily.mjs
      - name: Signature check tests (pinned base, orphans, checker from the last release)
        run: node scripts/test-check-signatures.mjs
      - name: Leak scan (tracked files and the built site; trusted copy)
        run: node "$TRUSTED_DIR/leak-scan.mjs"
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
